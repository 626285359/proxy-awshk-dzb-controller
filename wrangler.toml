# 告诉 Cloudflare 这是一个普通的 Worker
workers_dev = true

# 声明代码中用到的环境变量（用户在部署页面或稍后可以修改）
[vars]
WEB_USER = "joyycetutu"
WEB_PASS = "Rabbit11.."
PROXY_USER = "proxydzb"
PROXY_PASS = "dzb888888"

# 声明 D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "proxy_db"
database_id = "03e9cd3f-b441-4f2a-9cfd-446a9f48ac57" # 留空，一键部署向导或后续配置会引导用户绑定他们自己的 D1 数据库
